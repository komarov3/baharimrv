app = "baharimrv-s2-worker"

# The band reads are latency-bound, not CPU-bound: one remote COG open costs
# roughly the same 6 HTTP exchanges wherever the worker runs, and every one of
# them is answered from us-west-2. Measured from a client on the other side of
# the Atlantic, one 20x20 pixel window took 9 to 52 seconds. A region on the
# west coast of the US is the difference between a 5 second refresh and a minute.
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# Direct 6PN requests bypass Fly Proxy, so this worker must stay running.
[env]
  HOST = "::"
  MAX_CONCURRENCY = "2"
  TILE_STORE_BACKEND = "volume"

[checks.health]
  type = "tcp"
  port = 9000
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512"

# Tiles on a volume, not the ephemeral filesystem, so a restart does not re-render
# every project. Only needed with TILE_STORE_BACKEND=volume; R2 needs none.
# Create it once: fly volumes create s2_tiles --app baharimrv-s2-worker
[mounts]
  source = "s2_tiles"
  destination = "/data/tiles"
